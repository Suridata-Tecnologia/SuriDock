services:
  producer:
    build: .
    container_name: producer
    restart: always
    working_dir: /suridata_scripts
    command: ["python", "index.py"]
    env_file:
      - ./scripts/.env
    volumes:
      - ./scripts:/suridata_scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true # Allows keyboard input
    tty: true        # Allocates a pseudo-TTY